<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貓咪領地拼圖 (Queens: Cat Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdfaf6; /* 溫暖的紙張背景色 */
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .board {
            display: grid;
            gap: 0;
            border: 4px solid #2d3748;
            border-radius: 8px;
            overflow: hidden;
            background-color: #2d3748;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .cell {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-sizing: border-box;
            border: 0.5px solid rgba(45, 55, 72, 0.15); /* 預設淡色內邊線 */
            transition: background-color 0.2s, transform 0.1s;
        }

        @media (min-width: 640px) {
            .cell { font-size: 2rem; }
        }

        /* 粗邊界樣式 (不同色塊交界) */
        .border-t-heavy { border-top: 3.5px solid #2d3748 !important; }
        .border-b-heavy { border-bottom: 3.5px solid #2d3748 !important; }
        .border-l-heavy { border-left: 3.5px solid #2d3748 !important; }
        .border-r-heavy { border-right: 3.5px solid #2d3748 !important; }

        /* 動畫效果 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .conflict {
            animation: shake 0.4s ease-in-out;
            background-color: rgba(255, 99, 71, 0.6) !important;
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .pop {
            animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 勝利滿天星 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.7;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        /* 載入中遮罩 */
        #loading {
            backdrop-filter: blur(4px);
        }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            border-left-color: #f59e0b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 標題與控制列 -->
    <div class="w-full max-w-md flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-amber-200 rounded-xl flex items-center justify-center text-3xl shadow-sm">🐱</div>
            <div>
                <h1 class="text-xl font-bold text-gray-800">貓咪領地拼圖</h1>
                <p class="text-sm text-gray-500">Queens: Cat Edition</p>
            </div>
        </div>
        <button id="btn-new" class="w-10 h-10 bg-white border border-gray-200 rounded-full flex items-center justify-center shadow-sm text-gray-600 hover:bg-gray-50 active:scale-95 transition-transform" title="換新題目">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        </button>
    </div>

    <!-- 狀態列 (尺寸、進度、計時) -->
    <div class="w-full max-w-md bg-white border border-gray-100 rounded-2xl p-2 flex justify-between items-center shadow-sm mb-4">
        <div class="flex gap-1" id="size-selectors">
            <!-- 動態生成尺寸按鈕 -->
        </div>
        <div class="flex items-center gap-4 px-2 text-gray-600 font-bold">
            <div id="cat-counter" class="flex items-center gap-1 text-amber-600">🐱 0 / 6</div>
            <div id="timer" class="flex items-center gap-1 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span>00:00</span>
            </div>
        </div>
    </div>

    <!-- 遊戲盤面 -->
    <div id="board" class="board w-full max-w-md mb-6 relative">
        <!-- 格子動態產生在這裡 -->
    </div>

    <!-- 底部工具列 -->
    <div class="w-full max-w-md flex justify-between gap-2">
        <button id="btn-undo" class="flex-1 bg-white border border-gray-200 py-3 rounded-xl shadow-sm text-gray-600 font-bold active:scale-95 transition-transform flex items-center justify-center gap-1">
            <span>↶ 復原</span>
        </button>
        <button id="btn-clear" class="flex-1 bg-white border border-gray-200 py-3 rounded-xl shadow-sm text-red-500 font-bold active:scale-95 transition-transform flex items-center justify-center gap-1">
            <span>🗑 清空</span>
        </button>
        <button id="btn-hint" class="flex-1 bg-amber-100 border border-amber-200 py-3 rounded-xl shadow-sm text-amber-700 font-bold active:scale-95 transition-transform flex items-center justify-center gap-1">
            <span>💡 提示</span>
        </button>
    </div>
    
    <div class="w-full max-w-md text-center mt-4 text-xs text-gray-400">
        點擊: 空白 ➔ ✕ ➔ 🐱 ｜ 右鍵: 快速標記 ✕<br>
        規則：同行、同列、同色塊僅能一隻貓。不能對角線相鄰！
    </div>

    <!-- 載入中遮罩 -->
    <div id="loading" class="fixed inset-0 bg-white/80 z-50 flex flex-col items-center justify-center hidden">
        <div class="spinner mb-4"></div>
        <p class="text-gray-600 font-bold animate-pulse">演算法生成唯一解中...</p>
    </div>

    <script>
        /**
         * 貓咪領地拼圖 (Queens: Cat Edition) 核心邏輯
         * 包含 CSP 回溯驗證器與動態生長演算法
         */
        
        // --- 狀態變數 ---
        let N = 6;
        let regions = [];
        let state = []; // 0: 空, 1: X, 2: 貓
        let history = [];
        let solution = []; // 唯一解的貓咪座標
        let timerInterval = null;
        let seconds = 0;
        let isWin = false;

        // 柔和色彩盤 (Pastel Colors)
        const PALETTE = [
            '#FFD1DC', '#AEC6CF', '#FDFD96', '#B39EB5', '#FFB347',
            '#C2EABD', '#FFC0CB', '#77DD77', '#F49AC2', '#CB99C9'
        ];

        // --- 核心演算法：生成具有唯一解的盤面 ---
        async function generatePuzzle(size) {
            document.getElementById('loading').classList.remove('hidden');
            
            // 使用非同步防卡死
            return new Promise(resolve => {
                const attempt = () => {
                    // 1. 產生合法的 N 隻貓種子 (同行同列不重複、8向不相鄰)
                    let seeds = getValidQueenSeeds(size);
                    if (!seeds) { setTimeout(attempt, 0); return; }

                    // 2. 從種子隨機擴展生成色塊
                    let grid = growRegions(size, seeds);

                    // 3. 嚴格回溯驗證：確保該色塊圖【有且僅有 1 個解】
                    let result = countSolutionsAndGetOne(grid, size);
                    
                    if (result.count === 1) {
                        // 成功！
                        resolve({
                            grid: grid,
                            solution: result.solution
                        });
                    } else {
                        // 無解或多解，捨棄重試
                        setTimeout(attempt, 0);
                    }
                };
                attempt();
            });
        }

        // 產生合法種子 (N Queens with 8-way NO-TOUCH)
        function getValidQueenSeeds(size) {
            let cols = Array.from({length: size}, (_, i) => i);
            // 隨機打亂優先搜尋順序
            cols.sort(() => Math.random() - 0.5);
            
            let board = [];
            function solveQ(row) {
                if (row === size) return true;
                let start = Math.floor(Math.random() * size);
                for (let i = 0; i < size; i++) {
                    let c = (start + i) % size;
                    
                    // 檢查直行
                    if (board.some(p => p.c === c)) continue;
                    
                    // 檢查 8 向 (Chebyshev distance)
                    let way8 = false;
                    for (let p of board) {
                        if (Math.abs(p.r - row) <= 1 && Math.abs(p.c - c) <= 1) {
                            way8 = true; break;
                        }
                    }
                    if (way8) continue;

                    board.push({r: row, c: c});
                    if (solveQ(row + 1)) return true;
                    board.pop();
                }
                return false;
            }
            if (solveQ(0)) return board;
            return null;
        }

        // 幾何擴展：Voronoi / Flood-Fill
        function growRegions(size, seeds) {
            let grid = Array(size).fill(0).map(() => Array(size).fill(-1));
            let queue = [];
            
            seeds.forEach((s, i) => {
                grid[s.r][s.c] = i;
                queue.push({r: s.r, c: s.c, id: i});
            });

            // 隨機打亂擴張隊列
            queue.sort(() => Math.random() - 0.5);
            const dirs = [[-1,0], [1,0], [0,-1], [0,1]];

            while (queue.length > 0) {
                let qIdx = Math.floor(Math.random() * queue.length);
                let curr = queue.splice(qIdx, 1)[0];
                
                dirs.sort(() => Math.random() - 0.5);
                let expanded = false;
                for (let d of dirs) {
                    let nr = curr.r + d[0], nc = curr.c + d[1];
                    if (nr >= 0 && nr < size && nc >= 0 && nc < size && grid[nr][nc] === -1) {
                        grid[nr][nc] = curr.id;
                        queue.push({r: nr, c: nc, id: curr.id});
                        if (!expanded) {
                            queue.push(curr); // 自己可能還有其他方向可以擴，加回去
                            expanded = true;
                        }
                    }
                }
            }
            return grid;
        }

        // 嚴格求解器：使用 Bitmask 計算所有可能解
        function countSolutionsAndGetOne(grid, size) {
            let solutions = 0;
            let firstSolution = [];
            let currentCats = [];

            function solve(row, colMask, regionMask) {
                if (row === size) {
                    solutions++;
                    if (solutions === 1) firstSolution = [...currentCats];
                    return;
                }
                if (solutions > 1) return; // 已經多解，提前剪枝

                for (let c = 0; c < size; c++) {
                    let rId = grid[row][c];
                    
                    // 檢查行遮罩與色塊遮罩
                    if ((colMask & (1 << c)) !== 0) continue;
                    if ((regionMask & (1 << rId)) !== 0) continue;
                    
                    // 檢查 8 向衝突
                    let touch = false;
                    for (let cat of currentCats) {
                        if (Math.abs(cat.r - row) <= 1 && Math.abs(cat.c - c) <= 1) {
                            touch = true; break;
                        }
                    }
                    if (touch) continue;

                    currentCats.push({r: row, c: c});
                    solve(row + 1, colMask | (1 << c), regionMask | (1 << rId));
                    currentCats.pop();
                }
            }
            
            solve(0, 0, 0);
            return { count: solutions, solution: firstSolution };
        }


        // --- UI 與互動邏輯 ---
        
        async function initGame(newSize) {
            N = newSize;
            stopTimer();
            isWin = false;
            
            // 更新尺寸按鈕樣式
            const sizeBtns = [6, 7, 8, 9];
            const selContainer = document.getElementById('size-selectors');
            selContainer.innerHTML = sizeBtns.map(s => 
                `<button onclick="initGame(${s})" class="px-2 py-1 text-sm font-bold rounded-lg transition-colors ${s === N ? 'bg-amber-100 text-amber-700' : 'text-gray-400 hover:text-gray-600'}">${s}x${s}</button>`
            ).join('');

            // 非同步生成地圖
            let puzzle = await generatePuzzle(N);
            regions = puzzle.grid;
            solution = puzzle.solution;
            
            // 隨機分配顏色
            let colorMap = [...PALETTE].sort(() => Math.random() - 0.5);
            
            // 初始化狀態
            state = Array(N).fill(0).map(() => Array(N).fill(0));
            history = [];
            
            document.getElementById('loading').classList.add('hidden');
            renderBoard(colorMap);
            updateUI();
            startTimer();
        }

        function renderBoard(colorMap) {
            const board = document.getElementById('board');
            board.style.gridTemplateColumns = `repeat(${N}, minmax(0, 1fr))`;
            board.innerHTML = '';

            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    cell.style.backgroundColor = colorMap[regions[r][c] % colorMap.length];
                    
                    // 邊界粗線邏輯
                    if (r > 0 && regions[r-1][c] !== regions[r][c]) cell.classList.add('border-t-heavy');
                    if (r < N-1 && regions[r+1][c] !== regions[r][c]) cell.classList.add('border-b-heavy');
                    if (c > 0 && regions[r][c-1] !== regions[r][c]) cell.classList.add('border-l-heavy');
                    if (c < N-1 && regions[r][c+1] !== regions[r][c]) cell.classList.add('border-r-heavy');

                    // 事件監聽 (支援滑鼠與觸控)
                    cell.addEventListener('mousedown', (e) => handleCellInteraction(e, r, c));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(r, c);
                    });

                    board.appendChild(cell);
                }
            }
        }

        function handleCellInteraction(e, r, c) {
            if (isWin) return;
            if (e.button === 2) return; // 右鍵已攔截
            
            saveHistory();
            // 循環：0(空) -> 1(X) -> 2(貓) -> 0
            state[r][c] = (state[r][c] + 1) % 3;
            playSound(state[r][c]);
            updateUI();
        }

        function handleRightClick(r, c) {
            if (isWin) return;
            saveHistory();
            state[r][c] = state[r][c] === 1 ? 0 : 1; // 快速切換 X 與空白
            playSound(1);
            updateUI();
        }

        function saveHistory() {
            history.push(JSON.parse(JSON.stringify(state)));
            if (history.length > 20) history.shift();
        }

        function undo() {
            if (isWin || history.length === 0) return;
            state = history.pop();
            updateUI();
        }

        function clearBoard() {
            if (isWin) return;
            saveHistory();
            state = Array(N).fill(0).map(() => Array(N).fill(0));
            updateUI();
        }

        function showHint() {
            if (isWin) return;
            saveHistory();
            // 找出一個尚未放對的解答座標
            let missing = solution.find(s => state[s.r][s.c] !== 2);
            if (missing) {
                state[missing.r][missing.c] = 2;
                playSound(2);
                updateUI();
            }
        }

        function updateUI() {
            let catCount = 0;
            let conflicts = new Set();
            let cats = [];

            // 收集貓咪並繪製
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    let cell = document.getElementById(`cell-${r}-${c}`);
                    cell.classList.remove('conflict', 'pop');
                    
                    if (state[r][c] === 1) {
                        cell.innerHTML = '<span class="pop text-gray-800 font-bold text-lg md:text-2xl select-none opacity-75">✕</span>';
                    } else if (state[r][c] === 2) {
                        cell.innerHTML = '<span class="pop drop-shadow-md">🐱</span>';
                        cats.push({r, c, id: regions[r][c]});
                        catCount++;
                    } else {
                        cell.innerHTML = '';
                    }
                }
            }

            document.getElementById('cat-counter').innerText = `🐱 ${catCount} / ${N}`;
            if (catCount > N) document.getElementById('cat-counter').classList.add('text-red-500');
            else document.getElementById('cat-counter').classList.remove('text-red-500');

            // 檢查衝突
            for (let i = 0; i < cats.length; i++) {
                for (let j = i + 1; j < cats.length; j++) {
                    let c1 = cats[i], c2 = cats[j];
                    // 同行或同列
                    if (c1.r === c2.r || c1.c === c2.c) {
                        conflicts.add(`${c1.r}-${c1.c}`); conflicts.add(`${c2.r}-${c2.c}`);
                    }
                    // 同色塊
                    if (c1.id === c2.id) {
                        conflicts.add(`${c1.r}-${c1.c}`); conflicts.add(`${c2.r}-${c2.c}`);
                    }
                    // 8向距離 (Chebyshev <= 1)
                    if (Math.abs(c1.r - c2.r) <= 1 && Math.abs(c1.c - c2.c) <= 1) {
                        conflicts.add(`${c1.r}-${c1.c}`); conflicts.add(`${c2.r}-${c2.c}`);
                    }
                }
            }

            // 標示衝突
            conflicts.forEach(pos => {
                document.getElementById(`cell-${pos}`).classList.add('conflict');
            });

            // 判斷勝利
            if (catCount === N && conflicts.size === 0) {
                isWin = true;
                stopTimer();
                setTimeout(triggerVictory, 300);
            }
        }

        // --- 雜項：計時器、音效與特效 ---
        function startTimer() {
            seconds = 0;
            document.getElementById('timer').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg><span>00:00</span>`;
            timerInterval = setInterval(() => {
                seconds++;
                let m = String(Math.floor(seconds / 60)).padStart(2, '0');
                let s = String(seconds % 60).padStart(2, '0');
                document.getElementById('timer').querySelector('span').innerText = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 1) { // ✕ 的聲音
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 2) { // 貓咪聲音
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        function triggerVictory() {
            // 播放勝利和弦
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                setTimeout(() => {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 1);
                }, i * 150);
            });

            // 撒紙花
            for (let i = 0; i < 50; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];
                confetti.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // 綁定按鈕事件
        document.getElementById('btn-new').addEventListener('click', () => initGame(N));
        document.getElementById('btn-undo').addEventListener('click', undo);
        document.getElementById('btn-clear').addEventListener('click', clearBoard);
        document.getElementById('btn-hint').addEventListener('click', showHint);

        // 禁用全域右鍵選單
        document.addEventListener('contextmenu', e => e.preventDefault());

        // 啟動遊戲
        initGame(N);

    </script>
</body>
</html>
